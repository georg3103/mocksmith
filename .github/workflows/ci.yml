name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # basic exercises the full set; core-only asserts the companion packages
        # are genuinely absent while the server still works.
        example: [basic, core-only]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack every package
        # pnpm pack (not npm pack) replaces the workspace: protocol with real versions
        run: pnpm -r --filter './packages/*' pack --pack-destination /tmp/tarballs
      - name: Install only the tarballs this example declares
        working-directory: examples/${{ matrix.example }}
        run: node ../../scripts/install-tarballs.mjs /tmp/tarballs
      - name: Run the smoke check
        working-directory: examples/${{ matrix.example }}
        run: npm run smoke

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Typecheck the demo against the built packages
        run: pnpm --filter mocksmith-example-vite-app run typecheck
      - name: Install the browser
        run: pnpm --filter mocksmith-example-vite-app exec playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: examples/vite-app
        # Ports are fixed here: under CI getMockPortsEnv passes the preferred
        # ports through instead of reserving a pair, so the dev server, the mock
        # server and baseURL have to agree on them up front.
        run: pnpm test:e2e
        env:
          PORT: '3200'
          MOCKSMITH_PORT: '3201'
          # CI has no Google Chrome, so use the chromium installed above.
          PLAYWRIGHT_CHANNEL: chromium
